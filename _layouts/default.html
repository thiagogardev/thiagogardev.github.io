<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7f9;
      --fg: #0f172a;
      --fg-soft: #475569;
      --line: #e2e8f0;
      --accent: #0369a1;
      --accent-soft: #e0f2fe;
      --code-bg: #f1f5f9;
      --max: 860px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --bg-soft: #111a2b;
        --fg: #e5e7eb;
        --fg-soft: #9ca3af;
        --line: #1f2a3d;
        --accent: #38bdf8;
        --accent-soft: #0c2a3d;
        --code-bg: #111a2b;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.site {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky; top: 0; z-index: 10;
    }
    header.site .wrap {
      max-width: var(--max); margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--fg); font-weight: 600; letter-spacing: -0.01em; }
    .brand img { width: 30px; height: 30px; border-radius: 7px; flex: none; }
    .brand span { white-space: nowrap; }
    .brand span small { display: block; font-weight: 400; color: var(--fg-soft); font-size: 12px; line-height: 1; margin-top: 3px; }
    nav a { color: var(--fg-soft); margin-left: 18px; font-size: 15px; }
    nav a:hover { color: var(--fg); text-decoration: none; }

    main { max-width: var(--max); margin: 0 auto; padding: 40px 20px 80px; }

    h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 18px; }
    h1 + p { font-size: 19px; color: var(--fg-soft); }
    h2 { font-size: 24px; letter-spacing: -0.01em; margin: 48px 0 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    h3 { font-size: 18px; margin: 28px 0 8px; }
    p, li { max-width: 72ch; }
    blockquote {
      margin: 20px 0; padding: 14px 18px; border-left: 3px solid var(--accent);
      background: var(--accent-soft); color: var(--fg); border-radius: 0 8px 8px 0;
    }
    blockquote p { margin: 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }

    code, pre { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; font-size: 0.92em; }
    code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
    pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow: auto; }
    pre code { background: none; padding: 0; }

    .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { background: var(--bg-soft); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }

    .mermaid { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 16px 0; }
    .mermaid svg { max-width: 100%; height: auto; }

    footer.site { border-top: 1px solid var(--line); color: var(--fg-soft); font-size: 14px; }
    footer.site .wrap { max-width: var(--max); margin: 0 auto; padding: 24px 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      nav a { margin-left: 10px; font-size: 13px; }
      .brand { font-size: 15px; }
      .brand span small { display: none; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="">
        <span>Thiago Garofalo<small>garofalodeveloper.com</small></span>
      </a>
      <nav>
        <a href="{{ '/#projetos' | relative_url }}">Projetos</a>
        <a href="{{ '/cases/genesis.html' | relative_url }}">Case Genesis</a>
        <a href="https://github.com/thiagogardev" rel="me">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} Thiago Garofalo</span>
      <span>Site estático publicado a partir do repositório <a href="https://github.com/thiagogardev/thiagogardev.github.io">thiagogardev.github.io</a></span>
    </div>
  </footer>

  <script>
    // Tabelas roláveis no celular
    document.querySelectorAll('main table').forEach(function (t) {
      var w = document.createElement('div'); w.className = 'table-wrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    // Blocos ```mermaid virarem diagramas
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    if (blocks.length) {
      blocks.forEach(function (c) {
        var d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent;
        c.parentNode.replaceWith(d);
      });
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
      s.onload = function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'loose' });
        mermaid.run({ querySelector: '.mermaid' });
      };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
